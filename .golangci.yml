version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Correctness
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    # Modern-Go hygiene
    - usestdlibvars
    - predeclared # catches local helpers shadowing builtins like min/max
    - unconvert
    - misspell
  settings:
    errcheck:
      # CLI print statements and deferred closes are acceptable to ignore
      exclude-functions:
        - fmt.Println
        - fmt.Printf
        - fmt.Fprintf
        - fmt.Fprintln
        - (strings.Builder).WriteString

formatters:
  enable:
    - gofmt
